plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.yard.accounting"
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.yard.accounting"
        minSdk 23
        targetSdk 36
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    // 签名密钥来自环境变量（CodeMagic）或本地 key.properties，二者取其一。
    signingConfigs {
        release {
            keyAlias System.getenv("KEY_ALIAS") ?: keystoreProperties['keyAlias']
            keyPassword System.getenv("KEY_PASSWORD") ?: keystoreProperties['keyPassword']
            storeFile System.getenv("KEYSTORE_PATH") ? file(System.getenv("KEYSTORE_PATH")) : (keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null)
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            // 仅当存在签名密钥（CodeMagic 环境变量或本地 key.properties）时才用 release 签名；
            // 否则回退到 debug 签名，保证未配置密钥时测试包也能正常构建并安装。
            def hasKeystore = System.getenv("KEYSTORE_PATH") != null || keystoreProperties['storeFile'] != null
            signingConfig hasKeystore ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

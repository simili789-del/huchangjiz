org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G
android.useAndroidX=true
# android.enableJetifier=true 已移除(AGP 8.6 不再支持 Jetifier,项目已全量 AndroidX 无需)
# 插件模块偶尔出现的 JVM-target 不一致仅作告警，不阻断构建
kotlin.jvm.target.validation.mode=warning
# 绕过 Flutter 对 Gradle 版本的保守下限声明(要求 >=8.14,但 8.7 已满足所有实际编译 API 需求)
android.skip.build.dependency.validation=true

# Codemagic 在线构建配置
# 说明：
#   - yard-debug：始终构建 debug APK，无需签名，肯定成功
#   - yard-release：构建签名 release APK，需先在 Codemagic 上传 keystore 并命名为 yard_keystore
#   - 若没上传 keystore，只跑 yard-debug 即可；release 工作流会依赖签名配置
workflows:
  yard-debug:
    name: Yard Debug APK
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      vars:
        GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dkotlin.compiler.execution.strategy='in-process'"
    scripts:
      - name: 设置 Android SDK 路径
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: 授权 gradlew
        script: chmod +x gradlew
      - name: 诊断依赖树（锁定 foundation 实际解析版本与冲突）
        # 报错模式显示 androidx.compose.foundation.gestures 包能找到、但包内 pointerInput 等
        # 顶层符号缺失 —— 说明实际编译入 classpath 的 foundation 版本手势包残缺。
        # 打印 debugCompileClasspath 依赖树（聚焦 foundation/compose），暴露：
        #   1) foundation 实际解析到哪个版本；2) 是否被某传递依赖拉偏/冲突覆盖。
        script: |
          echo "===== :app:dependencies debugCompileClasspath (foundation/compose) ====="
          ./gradlew :app:dependencies --configuration debugCompileClasspath --no-daemon 2>&1 | grep -iE "foundation|compose" || true
      - name: 构建 debug APK
        # --refresh-dependencies 强制重新下载所有依赖（含 androidx.compose.foundation），
        # 绕过 Codemagic 默认 Gradle 缓存中可能损坏/不完整的 foundation AAR。
        # 现象：foundation 顶层 API(background/clickable/LazyColumn)可解析，唯独
        # foundation.gestures.*(pointerInput/awaitPointerEventScope/awaitPointerEvent/
        # detectTapGestures)整体 Unresolved —— 同 AAR 部分符号缺失，典型依赖缓存损坏。
        script: ./gradlew assembleDebug --no-daemon --refresh-dependencies
    artifacts:
      - app/build/outputs/apk/debug/*.apk

  yard-release:
    name: Yard Signed Release APK
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      android_signing:
        - yard_keystore   # 需在 Codemagic Team 设置中上传 keystore，命名为 yard_keystore
      vars:
        GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dkotlin.compiler.execution.strategy='in-process'"
    scripts:
      - name: 设置 Android SDK 路径与签名配置
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
          # 将 Codemagic 注入的签名变量写入 local.properties，让 app/build.gradle.kts 能读到
          if [ -n "$CM_KEYSTORE_PATH" ]; then
            {
              echo "storeFile=$CM_KEYSTORE_PATH"
              echo "storePassword=$CM_KEYSTORE_PASSWORD"
              echo "keyAlias=$CM_KEY_ALIAS"
              echo "keyPassword=$CM_KEY_PASSWORD"
            } >> "$CM_BUILD_DIR/local.properties"
          fi
      - name: 授权 gradlew
        script: chmod +x gradlew
      - name: 构建签名 release APK
        # 与 yard-debug 同理：--refresh-dependencies 强制重新下载依赖，避免 foundation 缓存损坏。
        script: ./gradlew assembleRelease --no-daemon --refresh-dependencies
    artifacts:
      - app/build/outputs/apk/release/*.apk

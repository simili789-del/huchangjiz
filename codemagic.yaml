workflows:
  huochang-release:
    name: 货场作业记账 - 发布版
    instance_type: linux
    max_build_duration: 30
    environment:
      java: 17
      node: 20
      groups:
        - keystore_credentials      # 在 CodeMagic 网页端创建该分组，包含下方变量
      vars:
        PACKAGE_NAME: "com.huochang.accounting"
      android_signing:
        - huochang_keystore          # 在 CodeMagic > Team settings > Code signing identities 上传的 Keystore 引用名
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    scripts:
      - name: 安装 Node 依赖
        script: |
          npm ci || npm install
      - name: 安装 Capacitor CLI 并添加 Android 平台
        script: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
      - name: 注入权限与签名配置
        script: |
          python3 scripts/postcap.py
      - name: 赋予 gradlew 执行权限
        script: |
          chmod +x android/gradlew
      - name: 构建 Release APK 与 AAB
        script: |
          cd android
          ./gradlew assembleRelease bundleRelease
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/**/mapping.txt
    publishing:
      email:
        recipients:
          - your-email@example.com          # 替换为你的邮箱以接收构建产物通知
        notify:
          success: true
          failure: true

  huochang-debug:
    name: 货场作业记账 - 调试版
    instance_type: linux
    max_build_duration: 30
    environment:
      java: 17
      node: 20
      vars:
        PACKAGE_NAME: "com.huochang.accounting"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "*"
          include: true
      cancel_previous_builds: true
    scripts:
      - name: 安装 Node 依赖
        script: |
          npm ci || npm install
      - name: 添加 Android 平台
        script: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
      - name: 注入权限配置
        script: |
          python3 scripts/postcap.py
      - name: 赋予 gradlew 执行权限
        script: |
          chmod +x android/gradlew
      - name: 构建 Debug APK
        script: |
          cd android
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
    publishing:
      email:
        recipients:
          - your-email@example.com          # 替换为你的邮箱以接收构建产物通知
        notify:
          success: true
          failure: true

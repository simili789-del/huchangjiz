name: Build Release APK

on:
  workflow_dispatch:   # 允许在 GitHub 网页/手机浏览器手动触发
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter (3.32.4, Dart 3.8.1)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.4'
          channel: 'stable'

      - name: Pub get
        run: flutter pub get

      - name: Generate code (Hive/Freezed)
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Restore signing keystore from Secrets
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/huchangjiz_release.keystore.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=huchangjiz_release.keystore.jks
          EOF

      - name: Build signed release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk

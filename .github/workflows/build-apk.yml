name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Unzip YardAccounting.zip
      run: unzip -o YardAccounting.zip

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Make gradlew executable
      run: chmod +x gradlew
      working-directory: YardAccounting

    - name: Build Debug APK
      run: ./gradlew assembleDebug
      working-directory: YardAccounting

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: YardAccounting/app/build/outputs/apk/debug/*.apk        path: app/build/outputs/apk/debug/*.apk

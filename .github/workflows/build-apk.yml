name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Unzip YardAccounting.zip
      run: unzip -o YardAccounting.zip

    # 打印解压后的所有文件名和目录结构
    - name: List Files
      run: |
        echo "=== Current Root Directory Files ==="
        ls -la
        echo "=== All Files in Repository ==="
        find . -maxdepth 3

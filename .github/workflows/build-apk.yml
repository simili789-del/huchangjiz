# GitHub Actions — 在线构建 Android APK（含可选「在线签名 release」）
#
# 触发: 推送到 main 分支，或在 Actions 页面手动触发 (workflow_dispatch)
# 产物: 在 Actions 运行结果的 Artifacts 中下载 app-debug.apk（和可选的 app-release.apk）
#
# 说明:
#   - 使用 ubuntu 云主机，自动安装 JDK17 + Android SDK(含许可证) + Gradle 8.2
#   - 默认始终构建 debug APK（可直接安装测试，无需签名）
#   - 若仓库配置了签名 Secrets，则额外自动构建「已签名」release APK（可上架/正式分发）
#   - 未配置 Secrets 时只出 debug 包，不会报错
#
# 加固记录 (2026-08-09):
#   1) 将无效的 `target: 34` 改为正确的 `build-tools: '34.0.0'（原参数被 setup-android 静默忽略，
#      导致云端缺少 build-tools 而 assembleDebug 失败）
#   2) 增加 `permissions: contents: read`（最小权限，降低安全扫描告警）
#   3) 超时从 30 分钟提升到 45 分钟（避免首次构建超时红叉）
#   4) 构建命令加 `--no-daemon`（CI 环境避免 Gradle daemon 残留）
#   5) 产物增加 `retention-days: 14`（控制存储占用）
#   6) 新增「条件签名 release」：仅当 secrets.KEYSTORE_BASE64 非空才签名出包，未配置则跳过（不报错）
name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# 最小权限原则：仅读取仓库内容即可，避免安全扫描报 "excess permissions"
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 设置 Android SDK（自动接受许可证）
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          # 注意：setup-android 不识别 `target` 参数，必须用 `build-tools`
          # 项目未显式声明 buildToolsVersion，云端必须显式安装，否则 assembleDebug 失败
          build-tools: '34.0.0'

      - name: 设置 Gradle 8.2（复用项目 wrapper 版本，自动缓存依赖）
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: 授权 gradlew 执行权限
        run: chmod +x gradlew

      - name: 构建 debug APK（始终执行）
        run: ./gradlew assembleDebug --no-daemon

      - name: 上传 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # ===== 在线出「已签名」release APK =====
      # 仅当仓库配置了签名 Secrets 才执行；未配置则自动跳过，不会产生报错。
      # 准备步骤见 README「在线出已签名 APK」一节。
      - name: 还原签名 keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          mkdir -p keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore/release.keystore
          {
            echo "storeFile=$(pwd)/keystore/release.keystore"
            echo "storePassword=${{ secrets.STORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } > local.properties

      - name: 构建签名 release APK
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: ./gradlew assembleRelease --no-daemon

      - name: 上传签名 release APK
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

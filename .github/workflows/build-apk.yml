# GitHub Actions — 在线构建 Android APK（含可选「在线签名 release」）
#
# 触发: 推送到 main 分支，或在 Actions 页面手动触发 (workflow_dispatch)
# 产物: 在 Actions 运行结果的 Artifacts 中下载 app-debug.apk（和可选的 app-release.apk）
#
# 说明:
#   - 使用 ubuntu 云主机，自动安装 JDK17 + Android SDK(含许可证) + Gradle 8.2
#   - 默认始终构建 debug APK（可直接安装测试，无需签名）
#   - 若仓库配置了签名 Secrets，则额外自动构建「已签名」release APK（可上架/正式分发）
#   - 未配置 Secrets 时只出 debug 包，不会报错
#
# 加固记录 (2026-08-09):
#   1) setup-android 默认只装 tools+platform-tools，不含 platform/build-tools；
#      必须用 sdkmanager 显式安装 platforms;android-34 与 build-tools;34.0.0，否则 assembleDebug 失败
#   2) permissions 设为 contents: write，以便把 APK 推送到 builds 分支供下载
#   3) 超时 45 分钟（避免首次冷构建超时）
#   4) 构建命令加 `--no-daemon`（CI 环境避免 Gradle daemon 残留）
#   5) 产物增加 `retention-days: 14`（控制存储占用）
#   6) 构建后把 APK 提交到 builds 分支，便于通过 raw 代理直接下载（绕过受限的 GitHub API）
#   7) 新增「条件签名 release」：仅当 secrets.KEYSTORE_BASE64 非空才签名出包，未配置则跳过（不报错）
name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# 需要 contents: write 才能把构建好的 APK 推送到 builds 分支供下载
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 设置 Android SDK（基础工具：cmdline-tools + platform-tools）
        uses: android-actions/setup-android@v3

      - name: 安装编译所需 platform-34 与 build-tools 34.0.0
        # 注意：setup-android 默认只装 tools+platform-tools，不含 platform/build-tools，
        # 这两个必须由 sdkmanager 显式安装，否则 assembleDebug 报“找不到 SDK 平台”而失败
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: 授权 gradlew 执行权限
        run: chmod +x gradlew

      - name: 构建 debug APK（始终执行）
        continue-on-error: true
        run: |
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log

      - name: 上传 debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # ===== 把 APK / 构建日志 提交到 builds 分支，便于通过 raw 代理直接下载 =====
      # 无论构建成功与否都执行：成功则提交 APK，失败则提交 build.log（便于排错）
      - name: 发布到 builds 分支（APK 或诊断日志）
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git branch -D builds 2>/dev/null || true
          git checkout --orphan builds
          git rm -rf --cached . >/dev/null 2>&1 || true
          APK=$(ls app/build/outputs/apk/debug/*.apk 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            cp "$APK" app-debug.apk
            git add -f app-debug.apk
            git commit -m "build: SUCCESS app-debug.apk $(date -u +%Y-%m-%dT%H:%M:%SZ)" || true
          else
            echo "BUILD_FAILED: APK 未生成，附上构建日志 build.log" > build_status.txt
            git add -f build.log build_status.txt 2>/dev/null || true
            git commit -m "build: FAILED $(date -u +%Y-%m-%dT%H:%M:%SZ)" || true
          fi
          git push --force "https://${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" builds

      # ===== 在线出「已签名」release APK =====
      # 仅当仓库配置了签名 Secrets 才执行；未配置则自动跳过，不会产生报错。
      # 准备步骤见 README「在线出已签名 APK」一节。
      - name: 还原签名 keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          mkdir -p keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore/release.keystore
          {
            echo "storeFile=$(pwd)/keystore/release.keystore"
            echo "storePassword=${{ secrets.STORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } > local.properties

      - name: 构建签名 release APK
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: ./gradlew assembleRelease --no-daemon

      - name: 上传签名 release APK
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

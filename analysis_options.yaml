include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # Radio.groupValue/onChanged 在新版 Flutter 被标记弃用，但 API 仍可用，
    # 且当前代码功能正常；暂忽略以避免 analyze 因 info 级警告非零退出中断构建。
    deprecated_member_use: ignore
  language:
    strict-casts: false
    strict-raw-types: false

# 注意：assets/images/ 的 asset_directory_does_not_exist 警告
# 已通过注释掉 pubspec.yaml 的 assets 声明解决，无需在此配置 lint 规则。
